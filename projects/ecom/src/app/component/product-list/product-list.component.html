
<app-nav-header/>
<!-- product search section -->

<div class="product-search-wrapper flex justify-end">
    <mat-form-field>
        <mat-label>
            Search Product
        </mat-label>
        <input matInput class="search-input" [(ngModel)]="searchProduct" (ngModelChange)="searchSubject$.next($event)"/>

    </mat-form-field>
</div>
<div class="products-list-wrapper">
    <div class="product-grid">
        @for (item of products; track $index) {
            <app-product-card [productDetails]="item"></app-product-card>
        }
    </div>

</div>
